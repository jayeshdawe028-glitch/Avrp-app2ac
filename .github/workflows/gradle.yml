name: Java CI with Gradle

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Restore Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Debug Native Symbols
        run: |
          echo "========== ARM64 BUILD ID =========="
          readelf -n app/build/intermediates/cxx/RelWithDebInfo/*/obj/arm64-v8a/libmultirium-client.so || true

          echo "========== ARMV7 BUILD ID =========="
          readelf -n app/build/intermediates/cxx/RelWithDebInfo/*/obj/armeabi-v7a/libmultirium-client.so || true

          echo "========== SYMBOL FILES =========="
          find app/build -type f \( -name "*.so" -o -name "*.sym" -o -name "*.txt" \)

          echo "========== STRIPPED =========="
          ls -R app/build/intermediates/stripped_native_libs || true

          echo "========== UNSTRIPPED =========="
          ls -R app/build/intermediates/merged_native_libs || true

      - name: Resolve Crash Address
        run: |
          SO=$(find app/build/intermediates/cxx -name libmultirium-client.so | head -n 1)

          echo "SO FILE: $SO"

          if [ -z "$SO" ]; then
            echo "libmultirium-client.so not found!"
            exit 1
          fi

          echo "========== ADDR2LINE =========="

          if command -v llvm-addr2line >/dev/null 2>&1; then
            llvm-addr2line -Cfpe "$SO" \
              0x1f0ac4 \
              0x1ead98
          elif command -v addr2line >/dev/null 2>&1; then
            addr2line -Cfpe "$SO" \
              0x1f0ac4 \
              0x1ead98
          else
            echo "addr2line not found!"
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AVRP-Release-APK
          path: |
            app/build/outputs/apk/release/*.apk
            **/build/outputs/apk/release/*.apk

      - name: Upload Native Debug Files
        uses: actions/upload-artifact@v4
        with:
          name: Native-Debug
          path: |
            app/build/intermediates/cxx/**/obj/**/*.so
            app/build/intermediates/native_symbol_tables/**/*.sym
